    <!-- Instant Pre-Hydration Theme & RTL Script (Prevents Flash) -->
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('ahmed_portfolio_theme');
          var isDark = savedTheme ? savedTheme === 'dark' : true;
          if (!isDark) {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.setAttribute('data-theme', 'light');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.setAttribute('data-theme', 'dark');
          }

          var savedLang = localStorage.getItem('ahmed_portfolio_lang_v3') || 'en';
          document.documentElement.lang = savedLang;
          document.documentElement.dir = savedLang === 'ar' ? 'rtl' : 'ltr';
          if (savedLang === 'ar') {
            document.documentElement.classList.add('rtl-mode');
            document.documentElement.classList.remove('ltr-mode');
          } else {
            document.documentElement.classList.add('ltr-mode');
            document.documentElement.classList.remove('rtl-mode');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Runtime Origin Fallback for Dynamic URLs -->
    <script>
      (function() {
        try {
          if (typeof window !== 'undefined' && window.location && window.location.origin) {
            var origin = window.location.origin;
            var link = document.createElement('link');
            link.rel = 'canonical';
            link.href = origin + window.location.pathname;
            document.head.appendChild(link);
            if (!origin.includes('localhost') && !origin.includes('127.0.0.1')) {
              var posterUrl = origin + '/og-image.jpg?v=8';
              var ogImg = document.querySelector('meta[property="og:image"]');
              var ogSecImg = document.querySelector('meta[property="og:image:secure_url"]');
              var twImg = document.querySelector('meta[name="twitter:image"]');
              var ogUrl = document.querySelector('meta[property="og:url"]');
              if (ogImg) ogImg.setAttribute('content', posterUrl);
              if (ogSecImg) ogSecImg.setAttribute('content', posterUrl);
              if (twImg) twImg.setAttribute('content', posterUrl);
              if (ogUrl) ogUrl.setAttribute('content', origin + '/');
            }
          }
        } catch (e) {}
      })();
    </script>
