name: Sync Portfolio Data

on:
  push:
    branches: [main]
    paths-ignore:
      - 'public/github-data.json'
      - 'public/last-updated.json'
  schedule:
    - cron: '0 6 * * *' # Every day at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch GitHub GraphQL Data & Update Snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ahmed-el-bialy
        run: node scripts/sync-github.mjs

      - name: Commit Synced Portfolio Snapshots
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/github-data.json public/last-updated.json data/portfolio.json
          git diff --staged --quiet || (git commit -m 'chore: sync github portfolio snapshot' && git push)

      - name: Trigger Vercel Production Deploy Hook (if configured)
        if: ${{ secrets.VERCEL_DEPLOY_HOOK != '' }}
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: curl -fsS -X POST "$VERCEL_DEPLOY_HOOK"
