<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#021526" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#00b4ab" />
    </linearGradient>

    <!-- Flutter Primary Blue Gradient -->
    <linearGradient id="flutterBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#54C5F8" />
      <stop offset="100%" stop-color="#02569B" />
    </linearGradient>

    <!-- Flutter Cyan Accent Gradient -->
    <linearGradient id="flutterCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#29B6F6" />
      <stop offset="100%" stop-color="#00B4AB" />
    </linearGradient>

    <!-- Flutter Dark Wing Gradient -->
    <linearGradient id="flutterDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0175C2" />
      <stop offset="100%" stop-color="#01579B" />
    </linearGradient>

    <!-- Ambient Shadow Filter -->
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container (Squircle) -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bgGradient)" stroke="url(#borderGrad)" stroke-width="4.5" />

  <!-- Subtle Inner Grid / Tech Pattern -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="#000000" opacity="0.35" />

  <!-- Flutter Geometric Iconic Bird Wings (Centered & Scaled for Perfect High-DPI Tab Visibility) -->
  <g transform="translate(18, 14) scale(1.4)" filter="url(#glowEffect)">
    <!-- Top-Right Wing -->
    <polygon points="34,2 62,30 46,46 18,18" fill="url(#flutterBlue)" />
    
    <!-- Middle Wing Bottom Right -->
    <polygon points="34,34 46,46 18,74 6,62" fill="url(#flutterCyan)" />
    
    <!-- Lower Overlay Diamond (Flutter standard geometry) -->
    <polygon points="34,34 46,46 34,58 22,46" fill="url(#flutterDark)" />
    
    <!-- Bottom Right Wing Tip -->
    <polygon points="34,58 46,46 62,62 50,74" fill="url(#flutterBlue)" />
  </g>

  <!-- Verified Online / Build Indicator in bottom-right corner -->
  <circle cx="106" cy="106" r="9" fill="#10B981" stroke="#0a0e1a" stroke-width="3" />
  <circle cx="106" cy="106" r="4.5" fill="#34D399" />
</svg>
