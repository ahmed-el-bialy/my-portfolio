<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Uzumaki Clan Crimson-Red Gradient -->
    <radialGradient id="uzumakiRed" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#FF2A2A" />
      <stop offset="55%" stop-color="#D90416" />
      <stop offset="88%" stop-color="#A8000B" />
      <stop offset="100%" stop-color="#730006" />
    </radialGradient>

    <!-- Outer Ambient Glow Filter -->
    <filter id="chakraGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#E50914" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Dark Background Circle for High Contrast on Light/Dark Browser Tabs -->
  <circle cx="64" cy="64" r="62" fill="#080a12" />

  <!-- Outer White Crest Ring (إطار الشعار الأبيض الخارجي كما في تيشيرت ناروتو) -->
  <circle cx="64" cy="64" r="58" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.9" />

  <!-- Main Uzumaki Red Medallion (قرص عشيرة الأوزوماكي الأحمر) -->
  <circle cx="64" cy="64" r="54" fill="url(#uzumakiRed)" stroke="#B80009" stroke-width="2" filter="url(#chakraGlow)" />

  <!-- Authentic Uzumaki Spiral (الدوامة الحلزونية المميزة لعشيرة الأوزوماكي في مانجا وأنمي ناروتو) -->
  <path
    d="M 64 64
       A 5 5 0 0 0 59 64
       A 10 10 0 0 0 69 64
       A 16 16 0 0 0 53 64
       A 22 22 0 0 0 75 64
       A 28 28 0 0 0 47 64
       A 34 34 0 0 0 81 64
       A 40 40 0 0 0 41 64
       A 45 45 0 0 0 87 64"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="5.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Top-Right Spiral Notch Flare (النهاية الانسيابية لشعار الأوزوماكي) -->
  <path
    d="M 87 64
       C 87 48 76 34 64 34"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="5.5"
    stroke-linecap="round"
  />

  <!-- Center Core Chakra Dot -->
  <circle cx="64" cy="64" r="3.5" fill="#FFFFFF" />
</svg>
