<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Perfectly Centered Circle Mask -->
    <clipPath id="centerCircle">
      <circle cx="64" cy="64" r="62" />
    </clipPath>

    <!-- Dark Ambient Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Base Clean Background -->
  <circle cx="64" cy="64" r="63" fill="#000000" />

  <!-- Perfectly Centered Konoha Leaf Symbol Image -->
  <image
    href="https://static.vecteezy.com/system/resources/thumbnails/026/620/795/small/konoha-symbol-hidden-leaf-naruto-free-vector.jpg"
    xlink:href="https://static.vecteezy.com/system/resources/thumbnails/026/620/795/small/konoha-symbol-hidden-leaf-naruto-free-vector.jpg"
    x="0"
    y="0"
    width="128"
    height="128"
    preserveAspectRatio="xMidYMid meet"
    clip-path="url(#centerCircle)"
    filter="url(#shadow)"
  />

  <!-- Subtle Outer Precision Border -->
  <circle cx="64" cy="64" r="62" fill="none" stroke="#333333" stroke-width="2" />
</svg>
