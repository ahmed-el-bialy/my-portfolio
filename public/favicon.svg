      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Secondary Brush Swirl Accents for Authentic Texture -->
    <path
      d="M 185 315
         C 195 365, 240 395, 295 392"
      fill="none"
      stroke="#ffffff"
      stroke-width="8"
      stroke-linecap="round"
