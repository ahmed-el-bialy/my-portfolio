<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#027DFD" />
      <stop offset="52%" stop-color="#00C7FF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="coreBg" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0b1324" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <radialGradient id="topSheen" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#00C7FF" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#00C7FF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Outer Luminous Dual Ring -->
  <circle cx="256" cy="256" r="248" fill="url(#ringGrad)" />
  <!-- Deep Obsidian Navy Core -->
  <circle cx="256" cy="256" r="224" fill="url(#coreBg)" stroke="rgba(255,255,255,0.2)" stroke-width="4" />
  <circle cx="256" cy="256" r="222" fill="url(#topSheen)" />

  <!-- Razor-Sharp Vector Leaf Spiral Emblem (Matching BrandLogoMark) -->
  <g transform="translate(56, 56) scale(4)">
    <!-- Left pointed triangular stem -->
    <path
      d="M27.5 47.5 L15.5 76.5 L41 76.5"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="7.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Continuous Leaf spiral flowing outward -->
    <path
      d="M52 54
         C55 54 57.5 51.5 57.5 48
         C57.5 42.5 52 38.5 46 39
         C38.5 39.5 34 46.5 34.5 54.5
         C35.2 65.5 44.5 73.5 56 73
         C69.5 72.5 79.5 61.5 79 47.5
         C78.5 32.5 66 22 50.5 22.5
         C36 23 27 33 24 44.5
         L15.5 76.5"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="7.4"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Signature upper-right leaf tip flick -->
    <path
      d="M65.5 26.5 C73 28 79 27.5 85.5 21"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="7.4"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
