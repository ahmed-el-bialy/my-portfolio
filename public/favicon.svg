<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Crisp drop shadow for browser tab visibility -->
    <filter id="crispShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Clean Off-White Background Matched Exactly with the Uploaded Image -->
  <rect width="512" height="512" rx="100" fill="#eaece9" />

  <!-- The Exact Konoha Symbol from the Uploaded Image -->
  <g filter="url(#crispShadow)" stroke="#1a1c1e" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" fill="none">
    
    <!-- Top-Right Diagonal Stem / Leaf Tip -->
    <line x1="362" y1="165" x2="415" y2="122" stroke-width="36" />

    <!-- Outer Leaf Contour and Base -->
    <path
      d="M 362 165
         C 280 135, 185 190, 115 340
         L 95 380
         L 325 390
         C 385 390, 408 340, 408 285
         C 408 200, 345 180, 255 180
         C 165 180, 160 300, 195 350
         C 230 390, 320 375, 335 305
         C 345 245, 285 225, 245 250
         C 225 265, 235 305, 265 305"
      stroke-width="34"
    />

    <!-- Left Triangle Inner Closing Line -->
    <path
      d="M 172 268
         L 200 375"
      stroke-width="32"
    />
  </g>
</svg>
