<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Solid Deep Black Background matching website_logo -->
  <rect width="512" height="512" rx="256" fill="#000000" />

  <!-- Pure White Konoha Spiral Symbol -->
  <g transform="translate(10, 0)">
    <!-- Main Outer Leaf Loop & Stem Tip -->
    <path
      d="M 125 350
         L 90 325
         L 135 275
         C 155 200, 220 155, 305 160
         C 385 165, 430 220, 430 295
         C 430 375, 370 425, 290 425
         C 200 425, 135 365, 125 350 Z"
      fill="none"
      stroke="#ffffff"
      stroke-width="26"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Diagonal Stem / Leaf Tip Projection -->
    <path
      d="M 370 205
         L 440 160"
      fill="none"
      stroke="#ffffff"
      stroke-width="28"
      stroke-linecap="round"
    />

    <!-- Inner Concentric Spiral Swirl 1 -->
    <path
      d="M 395 300
         C 395 360, 350 400, 290 400
         C 220 400, 168 348, 168 285
         C 168 220, 218 178, 285 178
         C 345 178, 385 220, 385 275
         C 385 330, 345 368, 295 368
         C 245 368, 210 335, 210 288
         C 210 250, 240 225, 275 225
         C 308 225, 330 250, 330 280
         C 330 305, 310 325, 288 325
         C 268 325, 255 310, 255 292
         C 255 278, 268 268, 282 268"
      fill="none"
